spring.application.name=sentiment-crawler
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/crawler_db
spring.datasource.username=postgres
spring.datasource.password=password

# Hibernate (ORM) Settings
# Automatically updates the database schema to match your Java classes
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Turn off SQL logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Disable Spring Transaction logging
logging.level.org.springframework.transaction=WARN